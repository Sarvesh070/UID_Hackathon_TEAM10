<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback | Campus Sports Meet 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Campus Sports Meet 2026</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="sports.html">Events & Registration</a></li>
                <li><a href="feedback.html">Feedback</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="feedback-container">
            <h2>Event Feedback</h2>
            <form id="feedbackForm">
                <input type="text" id="fName" placeholder="Student Name" required>
                <input type="text" id="fReg" placeholder="Register Number" required>
                <select id="fEvent" required>
                    <option value="">Select Event Attended</option>
                    <option value="Football">Football</option>
                    <option value="Chess">Chess</option>
                    <option value="100m Dash">100m Dash</option>
                    <option value="Badminton">Badminton</option>
                    <option value="Cricket">Cricket</option>
                </select>
                <div class="rating">
                    <label>Rating (1-5):</label>
                    <input type="number" id="rating" min="1" max="5" required>
                </div>
                <textarea id="comments" placeholder="Your comments (min 20 chars)..." rows="4" required></textarea>
                <button type="submit" class="btn">Submit Feedback</button>
            </form>

            <div id="feedbackSummary" class="summary-box" style="display:none;">
                <h3>Feedback Summary</h3>
                <p id="avgRating"></p>
                <div id="feedbackList"></div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Campus Sports Meet</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
